# Single-package repository: this file only carries pnpm settings.

overrides:
  # CodeMirror extensions break when two copies of a core package load; every dependent shares these.
  "@codemirror/autocomplete": "6.20.3"
  "@codemirror/commands": "6.11.1"
  "@codemirror/language": "6.12.4"
  "@codemirror/lint": "6.9.7"
  "@codemirror/search": "6.7.2"
  "@codemirror/state": "6.7.6"
  "@codemirror/view": "6.43.13"
  "@lezer/common": "1.5.3"
  "@lezer/highlight": "1.2.4"
  "@lezer/lr": "1.4.10"

# Install scripts are denied unless listed here.
allowBuilds:
  esbuild: true
  electron: true
  node-pty: true
  '@google/genai': false
  protobufjs: false
  electron-winstaller: false
  msgpackr-extract: false

patchedDependencies:
  # Tool-call arguments are parsed once at the end instead of on every streamed delta.
  '@earendil-works/pi-ai@1.0.0': patches/@earendil-works__pi-ai@1.0.0.patch
