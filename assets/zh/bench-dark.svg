<svg xmlns="http://www.w3.org/2000/svg" width="900" height="402" viewBox="0 0 900 402" role="img" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif"><title>实测对比：Rainy 和常见做法</title><rect x="0" y="6" width="12" height="12" rx="2" fill="#7d7c76"/><text x="18" y="17" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">常见做法</text><rect x="92" y="6" width="12" height="12" rx="2" fill="#3987e5"/><text x="110" y="17" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Rainy 4.7</text><text x="0" y="52" font-size="15" font-weight="600" fill="#f0efec" text-anchor="start">Claude 长对话：每步等到首个输出（秒，越短越好）</text><text x="0" y="74" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">常见做法每步上传整段对话；Rainy 只发新增内容。Haiku 5.5，上下文 1 万 → 14 万 token，各 24 步平均</text><text x="170" y="116.0" font-size="13" font-weight="400" fill="#f0efec" text-anchor="end">Claude Haiku 5.5</text><path d="M182,92 H686.8695652173913 Q690.8695652173913,92 690.8695652173913,96 V106 Q690.8695652173913,110 686.8695652173913,110 H182 Z" fill="#7d7c76"/><text x="698.8695652173913" y="105.5" font-size="12.5" font-weight="400" fill="#f0efec" text-anchor="start">4.2 秒</text><path d="M182,114 H466.5217391304348 Q470.5217391304348,114 470.5217391304348,118 V128 Q470.5217391304348,132 466.5217391304348,132 H182 Z" fill="#3987e5"/><text x="478.5217391304348" y="127.5" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">2.4 秒 · −43%</text><line x1="181.5" y1="88" x2="181.5" y2="140" stroke="#30363d" stroke-width="1"/><text x="0" y="184" font-size="15" font-weight="600" fill="#f0efec" text-anchor="start">上下文快满时，续接一次的花费（写摘要 = 100，越短越好）</text><text x="0" y="206" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">常见做法让模型写摘要；Rainy 留索引、按需查回原文。三轮长任务各跑两遍，12 项检查次次全过</text><text x="170" y="248.0" font-size="13" font-weight="400" fill="#f0efec" text-anchor="end">Claude Haiku 5.5</text><path d="M182,224 H678.0 Q682.0,224 682.0,228 V238 Q682.0,242 678.0,242 H182 Z" fill="#7d7c76"/><text x="690.0" y="237.5" font-size="12.5" font-weight="400" fill="#f0efec" text-anchor="start">100</text><path d="M182,246 H553.0 Q557.0,246 557.0,250 V260 Q557.0,264 553.0,264 H182 Z" fill="#3987e5"/><text x="565.0" y="259.5" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">75 · −25%</text><text x="170" y="306.0" font-size="13" font-weight="400" fill="#f0efec" text-anchor="end">Claude Sonnet 5.5</text><path d="M182,282 H678.0 Q682.0,282 682.0,286 V296 Q682.0,300 678.0,300 H182 Z" fill="#7d7c76"/><text x="690.0" y="295.5" font-size="12.5" font-weight="400" fill="#f0efec" text-anchor="start">100</text><path d="M182,304 H528.0 Q532.0,304 532.0,308 V318 Q532.0,322 528.0,322 H182 Z" fill="#3987e5"/><text x="540.0" y="317.5" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">70 · −30%</text><text x="170" y="364.0" font-size="13" font-weight="400" fill="#f0efec" text-anchor="end">DeepSeek V4.1 Flash</text><path d="M182,340 H678.0 Q682.0,340 682.0,344 V354 Q682.0,358 678.0,358 H182 Z" fill="#7d7c76"/><text x="690.0" y="353.5" font-size="12.5" font-weight="400" fill="#f0efec" text-anchor="start">100</text><path d="M182,362 H533.0 Q537.0,362 537.0,366 V376 Q537.0,380 533.0,380 H182 Z" fill="#3987e5"/><text x="545.0" y="375.5" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">71 · −29%</text><line x1="181.5" y1="220" x2="181.5" y2="388" stroke="#30363d" stroke-width="1"/></svg>
