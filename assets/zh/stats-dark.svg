<svg xmlns="http://www.w3.org/2000/svg" width="900" height="168" viewBox="0 0 900 168" role="img" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif"><title>Rainy 4.7 的几个数字</title><rect x="0.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(255,255,255,0.16)"/><text x="16.0" y="30" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">安装包</text><text x="16.0" y="96" font-size="34" font-weight="600" fill="#f0efec" text-anchor="start">16 MB</text><text x="16.0" y="128" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">编程工具、Linux 环境</text><text x="16.0" y="146" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">用到时才下载</text><rect x="228.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(255,255,255,0.16)"/><text x="244.0" y="30" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Claude 长对话</text><text x="244.0" y="48" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">每步等到首个输出</text><text x="244.0" y="96" font-size="34" font-weight="600" fill="#f0efec" text-anchor="start">−43%</text><text x="244.0" y="128" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">4.2 秒 → 2.4 秒</text><text x="244.0" y="146" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Anthropic message threads</text><rect x="456.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(255,255,255,0.16)"/><text x="472.0" y="30" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">上下文快满时</text><text x="472.0" y="48" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">续接的花费</text><text x="472.0" y="96" font-size="34" font-weight="600" fill="#f0efec" text-anchor="start">−25–30%</text><text x="472.0" y="128" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Claude、DeepSeek 实测</text><text x="472.0" y="146" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">检索原文，不写摘要</text><rect x="684.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(255,255,255,0.16)"/><text x="700.0" y="30" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">长对话里的早期细节</text><text x="700.0" y="96" font-size="34" font-weight="600" fill="#f0efec" text-anchor="start">12 / 12</text><text x="700.0" y="128" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">12 次实测全部答对</text><text x="700.0" y="146" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">报错原文、条款不走样</text></svg>
