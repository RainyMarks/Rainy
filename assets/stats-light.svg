<svg xmlns="http://www.w3.org/2000/svg" width="900" height="168" viewBox="0 0 900 168" role="img" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif"><title>Rainy 4.7 in numbers</title><rect x="0.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(11,11,11,0.14)"/><text x="16.0" y="30" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Installer</text><text x="16.0" y="96" font-size="34" font-weight="600" fill="#0b0b0b" text-anchor="start">16 MB</text><text x="16.0" y="128" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Coding tools and Linux</text><text x="16.0" y="146" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">runtime come when used</text><rect x="228.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(11,11,11,0.14)"/><text x="244.0" y="30" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Long Claude chats:</text><text x="244.0" y="48" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">wait for first output</text><text x="244.0" y="96" font-size="34" font-weight="600" fill="#0b0b0b" text-anchor="start">−43%</text><text x="244.0" y="128" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">4.2 s → 2.4 s a step</text><text x="244.0" y="146" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Anthropic message threads</text><rect x="456.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(11,11,11,0.14)"/><text x="472.0" y="30" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Context full: cost</text><text x="472.0" y="48" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">of carrying on</text><text x="472.0" y="96" font-size="34" font-weight="600" fill="#0b0b0b" text-anchor="start">−25–30%</text><text x="472.0" y="128" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Measured on Claude</text><text x="472.0" y="146" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">and DeepSeek</text><rect x="684.5" y="0.5" width="215.0" height="167" rx="8" fill="none" stroke="rgba(11,11,11,0.14)"/><text x="700.0" y="30" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Early details in</text><text x="700.0" y="48" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">long chats</text><text x="700.0" y="96" font-size="34" font-weight="600" fill="#0b0b0b" text-anchor="start">12 / 12</text><text x="700.0" y="128" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">runs answered every</text><text x="700.0" y="146" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">detail correctly</text></svg>
