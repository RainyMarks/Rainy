<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RainyAgent · 离线工具安装</title>
  <link rel="stylesheet" href="setup.css">
  <link rel="stylesheet" href="toolpack.css">
</head>
<body>
  <main aria-labelledby="heading">
    <div class="brand">RAINYAGENT</div>
    <h1 id="heading">安装离线工具</h1>
    <section aria-label="当前安装阶段">
      <div class="phase-line">
        <span id="phase" class="state">准备安装</span>
        <span id="percent" class="percent" aria-hidden="true"></span>
      </div>
      <p id="message" role="status" aria-live="polite">正在读取安装进度…</p>
      <p id="current-path" class="current-path" aria-label="当前文件" hidden></p>
      <progress id="progress" aria-label="当前阶段进度"></progress>
      <p id="bytes" class="bytes"></p>
    </section>
    <div class="actions">
      <button id="cancel" type="button" class="secondary" disabled>取消安装</button>
      <p id="cancel-state" class="cancel-state" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script src="toolpack.js"></script>
</body>
</html>
