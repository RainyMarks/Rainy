<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Rainy · 开发工具准备</title>
  <link rel="stylesheet" href="setup.css">
  <link rel="stylesheet" href="ide.css">
</head>
<body data-en-title="Rainy · Development tools">
  <main>
    <div class="brand">RAINYAGENT</div>
    <h1 data-en="Prepare development tools">准备开发工具</h1>
    <p class="intro" data-en="Prepares Python, C/C++ compilers, formatters and debuggers in the Linux environment of this workspace.">为当前工作区的 Linux 环境准备 Python、C/C++ 编译、格式化和调试工具。</p>
    <p class="intro"><span data-en="Environment: ">所选环境：</span><strong id="distribution" data-en="Reading…">正在读取…</strong></p>
    <section aria-live="polite" aria-atomic="true">
      <span id="state" class="state" data-en="Checking">正在检查</span>
      <p id="message" data-en="Checking development tools…">正在检查开发工具…</p>
      <p id="error-code" class="code" hidden></p>
      <ul id="tools" aria-label="开发工具状态" data-en-label="Development tool status"></ul>
      <p id="incomplete" hidden></p>
    </section>
    <div class="actions">
      <button id="install" hidden data-en="Install development tools">安装开发工具</button>
      <button id="retry" class="secondary" data-en="Check again">重新检查</button>
      <button id="close" class="secondary" data-en="Back to the workspace">返回工作区</button>
    </div>
    <details id="diagnostics" hidden>
      <summary data-en="Installation details">安装详情</summary>
      <pre id="log" tabindex="0"></pre>
    </details>
    <div class="footnote">
      <p data-en="Installing first downloads the Ubuntu development packages (about 150 MB, once), then installs them as root in the selected Linux environment without using its package sources. Keep this window open until it finishes.">点击安装后，会先下载 Ubuntu 开发组件（约 150 MB，只需一次），再以所选 Linux 环境的 root 用户安装，不使用它的软件源。安装期间请等待完成后再关闭窗口。</p>
      <p data-en="These packages are for Ubuntu 26.04 amd64. On other distributions, install the missing tools listed here yourself.">这些组件适用于 Ubuntu 26.04 amd64。其他发行版可根据缺失工具列表手动准备。</p>
    </div>
  </main>
  <script src="locale.js"></script>
  <script src="ide.js"></script>
</body>
</html>
