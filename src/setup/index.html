<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RainyAgent · 环境准备</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body data-en-title="RainyAgent · Environment setup">
  <main>
    <div class="brand">RAINYAGENT</div>
    <h1 data-en="Prepare the runtime environment">准备运行环境</h1>
    <p class="intro" data-en="The first run needs a local Linux environment. The installer already includes the files it needs.">首次运行需要一个本地 Linux 环境。安装包已包含所需文件。</p>
    <section aria-live="polite" aria-atomic="true">
      <span id="state" class="state" data-en="Checking">正在检查</span>
      <p id="message" data-en="Checking this computer…">正在检查本机环境…</p>
      <p id="error-code" class="code" hidden></p>
    </section>
    <div id="actions" class="actions">
      <button id="install" hidden data-en="Install system components">安装系统组件</button>
      <button id="create" hidden data-en="Create a dedicated environment">创建专用环境</button>
      <button id="resume" hidden data-en="Continue setup">继续准备</button>
      <button id="retry" class="secondary" data-en="Check again">重新检查</button>
    </div>
    <details id="existing" hidden>
      <summary data-en="Use an existing WSL2 environment">使用已有 WSL2 环境</summary>
      <p data-en="The environment needs Bash and Python 3.12 or later. RainyAgent stores chat data in it.">所选环境需要 Bash 和 Python 3.12 或更新版本。RainyAgent 会在其中保存聊天数据。</p>
      <div class="selection"><select id="distros" aria-label="已有 WSL2 发行版" data-en-label="Existing WSL2 distributions"></select><button id="select" class="secondary" data-en="Use this environment">使用此环境</button></div>
    </details>
    <div class="footnote"><p><span data-en="Dedicated environment location: ">专用环境位置：</span><span id="location"></span></p><p data-en="Save other work before a restart. Setup keeps its progress and continues the next time you open RainyAgent.">需要重启时请先保存其他工作。准备过程会保留进度，下次打开可继续。</p></div>
  </main>
  <script src="locale.js"></script>
  <script src="setup.js"></script>
</body>
</html>
