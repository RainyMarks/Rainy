<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RainyAgent · 环境准备</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main>
    <div class="brand">RAINYAGENT</div>
    <h1>准备运行环境</h1>
    <p class="intro">首次运行需要一个本地 Linux 环境。安装包已包含所需文件。</p>
    <section aria-live="polite" aria-atomic="true">
      <span id="state" class="state">正在检查</span>
      <p id="message">正在检查本机环境…</p>
      <p id="error-code" class="code" hidden></p>
    </section>
    <div id="actions" class="actions">
      <button id="install" hidden>安装系统组件</button>
      <button id="create" hidden>创建专用环境</button>
      <button id="resume" hidden>继续准备</button>
      <button id="retry" class="secondary">重新检查</button>
    </div>
    <details id="existing" hidden>
      <summary>使用已有 WSL2 环境</summary>
      <p>所选环境需要 Bash 和 Python 3.12 或更新版本。RainyAgent 会在其中保存聊天数据。</p>
      <div class="selection"><select id="distros" aria-label="已有 WSL2 发行版"></select><button id="select" class="secondary">使用此环境</button></div>
    </details>
    <div class="footnote"><p>专用环境位置：<span id="location"></span></p><p>需要重启时请先保存其他工作。准备过程会保留进度，下次打开可继续。</p></div>
  </main>
  <script src="setup.js"></script>
</body>
</html>
