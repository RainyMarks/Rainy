[workspace]
resolver = "2"
members = ["crates/protocol", "crates/carrier", "crates/app", "crates/host"]
default-members = ["crates/app"]

[workspace.package]
version = "4.12.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[workspace.dependencies]
rainy-protocol = { path = "crates/protocol" }
rainy-carrier = { path = "crates/carrier" }
# GPUI Kit pins the exact gpui-pre snapshot it was built against; keep both in step.
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
futures = "0.3"
log = "0.4"

# gpui-pre 0.3.9 with Chinese line breaking: closing punctuation never starts a line, opening punctuation never ends
# one (vendor/gpui-pre/RAINY.md); gpui-base 0.8.0 with editor fixes (vendor/gpui-base/RAINY.md). Replace both copies
# together with gpui-kit.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-base = { path = "vendor/gpui-base" }

[profile.release]
opt-level = 3
# Fat LTO: about 1.5 MB smaller than thin LTO for RainyAgent.exe, at twice the build time.
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# QA and review builds (RAINY_PROFILE=qa in native/scripts/build-*.sh, output in target/qa): release optimisation, but
# thin LTO on every core instead of one fat-LTO thread. Packages that are published always use [profile.release].
[profile.qa]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.dev]
# GPUI is unusably slow without optimisation; keep our own crates debuggable. Dependencies keep line tables only (file
# and line in backtraces): full debug info made the debug Rainy.exe about 1.2 GB and every relink slow.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"
