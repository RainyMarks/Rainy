[workspace]
resolver = "2"
members = ["crates/protocol", "crates/carrier", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "4.0.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[workspace.dependencies]
rainy-protocol = { path = "crates/protocol" }
rainy-carrier = { path = "crates/carrier" }
# GPUI Kit pins the exact gpui-pre snapshot it was built against; keep both in step.
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
futures = "0.3"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# GPUI is unusably slow without optimisation; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
