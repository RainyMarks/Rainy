[package]
name = "rainy"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "Rainy"
path = "src/main.rs"

[dependencies]
rainy-protocol.workspace = true
rainy-carrier.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
async-channel = "2"
similar = "2.7"
# The editor's language-server types, as GPUI Kit uses them (inline completions are a proposed part).
lsp-types = { version = "0.97.0", features = ["proposed"] }
latex-rust = "3.0.1"
base64 = "0.22"
# Markdown export: the PDF text fix (`web/pdf_text.rs`).
flate2 = "1.1"
regex = "1.13"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
alacritty_terminal = "0.26"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3.0.12"
# For the release keyring check, which compiles ../carrier/src/keyring.rs.
anyhow.workspace = true
base64 = "0.22"
serde_json.workspace = true
sha2 = "0.11"
