[package]
name = "rainy-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Rainy Host: agent, editor services and files for one execution environment"

[[bin]]
name = "rainy-host"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
futures.workspace = true
bytes = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream", "json", "http2"] }
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.11.1"
aes-gcm = "0.10"
url = "2.5"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
dunce = "1"
encoding_rs = "0.8"
regex = "1.13"
rainy-protocol = { path = "../protocol" }
fancy-regex = "0.14"
ignore = "0.4"
tokio-util = "0.7"
portable-pty = "0.9"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
