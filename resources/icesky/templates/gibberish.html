<!-- gibberish tool view. -->
<div class="tab-content tab-content-gibberish"><div class="transform-layout"><div class="transform-section gibberish-section gibberish-shell"><div class="workspace-rail gibberish-rail"><div class="section-header-card workbench-intro-card workbench-panel-side gibberish-topbar-card"><div class="section-header-card-title"><i class="fas fa-comments"></i><h3>乱码生成器</h3></div></div><div class="console-panel gibberish-mode-panel workbench-panel-side"><div class="pc-label">工作模式</div><div class="button-group"><button :class="['btn', gibberishMode === 'random' ? 'btn-primary' : 'btn-secondary']" @click="gibberishMode = 'random'" type="button"><i class="fas fa-dice"></i> 乱码字典
 </button><button :class="['btn', gibberishMode === 'removal' ? 'btn-primary' : 'btn-secondary']" @click="gibberishMode = 'removal'" type="button"><i class="fas fa-eraser"></i> 字符删除
 </button></div></div><template v-if="gibberishMode === 'random'"><div class="input-section gibberish-input-panel workbench-panel-side"><div class="section-header"><h4><i class="fas fa-pen"></i> 输入文本</h4><p>保留原有标点和结构，为每个词建立稳定映射并输出对应乱码。</p></div><textarea id="gibberish-input" v-model="gibberishInput" placeholder="输入要转换成乱码的文本..." rows="10"></textarea></div><div class="options-grid"><label>
 种子(可选)
 <input type="text" v-model="gibberishSeed" placeholder="留空则随机"></label><label>
 字符集
 <input type="text" v-model="gibberishChars" placeholder="例如：示例文本..."></label></div><div class="tool-toolbar workbench-toolbar-compact sticky-toolbar"><button type="button" class="transform-button tool-primary-btn" @click="sentenceToGibberish"><i class="fas fa-hammer"></i> 开始生成
 </button></div></template><template v-else=""><div class="console-panel gibberish-submode-panel workbench-panel-side"><div class="pc-label">删除模式</div><div class="button-group"><button :class="['btn', removalSubMode === 'random' ? 'btn-primary' : 'btn-secondary']" @click="removalSubMode = 'random'" type="button"><i class="fas fa-random"></i> 随机删除
 </button><button :class="['btn', removalSubMode === 'specific' ? 'btn-primary' : 'btn-secondary']" @click="removalSubMode = 'specific'" type="button"><i class="fas fa-crosshairs"></i> 指定字符
 </button></div></div><template v-if="removalSubMode === 'random'"><div class="input-section gibberish-input-panel workbench-panel-side"><div class="section-header"><h4><i class="fas fa-pen"></i> 输入文本</h4><p>从每个词中随机删除部分字符，批量生成多个变体。</p></div><textarea id="removal-input" v-model="removalInput" placeholder="输入要随机删字符的文本..." rows="10"></textarea></div><div class="options-grid"><label>
 变体数量
 <input type="number" v-model.number="removalVariations" min="1" max="100" placeholder="10"></label><label>
 最少删除字符数
 <input type="number" v-model.number="removalMinLetters" min="0" max="10" placeholder="1"></label><label>
 最多删除字符数
 <input type="number" v-model.number="removalMaxLetters" min="1" max="20" placeholder="3"></label><label>
 种子(可选)
 <input type="text" v-model="removalSeed" placeholder="留空则随机"></label></div><div class="tool-toolbar workbench-toolbar-compact sticky-toolbar"><button type="button" class="transform-button tool-primary-btn" @click="generateRandomRemovals"><i class="fas fa-dice"></i> 开始生成
 </button><button class="action-button copy" v-if="removalOutputs.length" @click="copyAllRemovals" type="button"><i class="fas fa-copy"></i> 复制全部
 </button></div></template><template v-else=""><div class="input-section gibberish-input-panel workbench-panel-side"><div class="section-header"><h4><i class="fas fa-pen"></i> 输入文本</h4><p>从文本里移除你指定的一组字符，适合做快速简化或定向扰动。</p></div><textarea id="removal-specific-input" v-model="removalSpecificInput" placeholder="输入要处理的文本..." rows="10"></textarea></div><div class="options-grid"><label>
 要删除的字符
 <input type="text" v-model="removalCharsToRemove" placeholder="例如：aeiou"><small>输入你想移除的具体字符集合。</small></label></div><div class="tool-toolbar workbench-toolbar-compact sticky-toolbar"><button type="button" class="transform-button tool-primary-btn" @click="generateSpecificRemoval"><i class="fas fa-eraser"></i> 开始处理
 </button></div></template></template></div><div class="workspace-stage gibberish-stage"><template v-if="gibberishMode === 'random'"><div v-if="gibberishOutput" class="console-panel gibberish-output-panel workbench-panel-stage"><div class="section-header"><h4><i class="fas fa-language"></i> 文本结果</h4><p>保留原有句式结构，只替换词级内容。</p></div><div class="textarea-copy-wrap"><textarea v-model="gibberishOutput" readonly="" rows="10"></textarea><button class="copy-button" @click="copyToClipboard(gibberishOutput)" title="复制" type="button"><i class="fas fa-copy"></i></button></div></div><div v-if="gibberishDictionary" class="console-panel gibberish-dictionary-panel workbench-panel-stage"><div class="section-header"><h4><i class="fas fa-book"></i> 映射字典</h4><p>方便复现或回查每个词对应的随机映射。</p></div><div class="textarea-copy-wrap"><textarea v-model="gibberishDictionary" readonly="" rows="8"></textarea><button class="copy-button" @click="copyToClipboard(gibberishDictionary)" title="复制" type="button"><i class="fas fa-copy"></i></button></div></div><div v-if="!gibberishOutput" class="workbench-empty-panel"><i class="fas fa-comments"></i><h4>等待开始生成</h4><p>选择“乱码字典”模式后，在左侧输入文本并点击“开始生成”。</p></div></template><template v-else-if="removalSubMode === 'random'"><div v-if="removalOutputs.length" class="console-panel gibberish-variants-panel workbench-panel-stage"><div class="section-header"><h4><i class="fas fa-list"></i> 删除变体</h4><p>共生成{{ removalOutputs.length }}条结果，可逐条复制或全部导出。</p></div><div class="split-messages-grid"><div v-for="(output, index) in removalOutputs" :key="index" class="split-message-card"><div class="split-message-header"><span class="message-number">变体 {{ index + 1 }}</span><button class="copy-button-small" @click="copyToClipboard(output)" title="复制" type="button"><i class="fas fa-copy"></i></button></div><div class="split-message-content">{{ output }}</div></div></div></div><div v-else="" class="workbench-empty-panel"><i class="fas fa-scissors"></i><h4>等待批量变体</h4><p>在左侧配置删除范围和数量后，点击“开始生成”。</p></div></template><template v-else=""><div v-if="removalSpecificOutput" class="console-panel gibberish-result-panel workbench-panel-stage"><div class="section-header"><h4><i class="fas fa-check"></i> 文本结果</h4><p>指定字符已从文本中移除。</p></div><div class="textarea-copy-wrap"><textarea v-model="removalSpecificOutput" readonly="" rows="10"></textarea><button class="copy-button" @click="copyToClipboard(removalSpecificOutput)" title="复制" type="button"><i class="fas fa-copy"></i></button></div></div><div v-else="" class="workbench-empty-panel"><i class="fas fa-filter-circle-xmark"></i><h4>等待指定删除</h4><p>填写左侧文本和目标字符后，点击“开始处理”。</p></div></template></div></div></div></div>
