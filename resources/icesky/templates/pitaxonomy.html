<!-- pitaxonomy tool view. -->
<div class="tab-content tab-content-pitaxonomy"><div class="transform-layout"><div class="transform-section pitaxonomy-shell"><div class="workspace-stage pitaxonomy-stage pitaxonomy-knowledge-stage"><div v-if="pitLoading" class="workbench-empty-panel compact-empty"><i class="fas fa-spinner fa-spin"></i><h4>正在加载分类数据</h4></div><div v-else-if="pitError" class="pc-error"><i class="fas fa-exclamation-triangle"></i> {{ pitError }}</div><template v-else=""><div class="console-panel pitaxonomy-topbar-panel"><div class="pitaxonomy-heading"><div><h3><i class="fas fa-sitemap"></i> 注入技术</h3></div><span class="pitaxonomy-total">{{ pitGetAllEntries().length }} 个条目 · 4 个分类</span></div><div class="pitaxonomy-filter-grid pitaxonomy-topbar-filters"><label class="pitaxonomy-filter-field"><span class="pitaxonomy-filter-label">分类</span><select v-model="pitSection"><option value="all">全部分类</option><option value="intents">攻击意图</option><option value="techniques">技术手法</option><option value="evasions">规避方式</option><option value="inputs">输入面</option></select></label><div class="pitaxonomy-search-field"><label for="pitaxonomy-search" class="pitaxonomy-search-label">搜索条目</label><div class="pitaxonomy-search-input-wrap"><i class="fas fa-search pitaxonomy-search-icon" aria-hidden="true"></i><input id="pitaxonomy-search" ref="pitSearchInput" type="search" v-model.trim="pitSearch" aria-describedby="pitaxonomy-search-hint" placeholder="输入关键词，查找注入技术…"><button v-if="pitSearch" type="button" class="pitaxonomy-search-clear" @click="pitSearch = ''; $nextTick(() => $refs.pitSearchInput.focus())" title="清空搜索" aria-label="清空搜索"><i class="fas fa-times"></i></button></div><div id="pitaxonomy-search-hint" class="pitaxonomy-search-hint"><span>匹配标题、描述、思路与案例</span><span role="status">{{ pitSearch ? '找到 ' + pitGetFilteredEntries().length + ' 个条目' : '输入即筛选' }}</span></div></div></div></div><section v-if="pitData.sourceNotes &amp;&amp; pitData.sourceNotes.length" class="console-panel pitaxonomy-source-panel" aria-label="外部研究来源"><div class="pitaxonomy-source-heading"><div><span class="pitaxonomy-source-kicker"><i class="fas fa-shield-halved"></i> 研究更新</span><h4>外部研究来源与防御提示</h4></div></div><article v-for="note in pitData.sourceNotes" :key="note.source" class="pitaxonomy-source-note"><div><strong>{{ note.title }}</strong><p>{{ note.summary }}</p></div><a class="action-button" :href="note.source" target="_blank" rel="noopener noreferrer"><i class="fas fa-arrow-up-right-from-square"></i> 查看来源</a></article></section><div class="pitaxonomy-reading-layout"><aside class="console-panel pitaxonomy-directory-panel" aria-label="知识目录"><div class="pitaxonomy-directory-heading"><h4>知识目录</h4><small>{{ pitGetFilteredEntries().length }} 项</small></div><nav class="pitaxonomy-anchor-nav" aria-label="分类筛选"><button v-for="section in ['all', 'intents', 'techniques', 'evasions', 'inputs']" :key="'anchor-' + section" type="button" class="pitaxonomy-anchor-button" :class="{ active: pitSection === section }" :aria-pressed="pitSection === section ? 'true' : 'false'" @click="pitFilterSection(section)"><i class="fas" :class="pitSectionIcon(section)"></i><strong>{{ section === 'all' ? '全部条目' : pitSectionLabel(section) }}</strong><small>{{ section === 'all' ? pitGetAllEntries().length : pitCount(section) }}</small></button></nav><div class="pitaxonomy-directory-actions"><button type="button" class="action-button" @click="pitExpandAllGroups()"><i class="fas fa-expand"></i> 展开全部</button><button type="button" class="action-button" @click="pitCollapseAllGroups()"><i class="fas fa-compress"></i> 折叠全部</button></div><div v-if="pitGetSelectedEntry()" class="pitaxonomy-current-entry"><small>当前条目</small><strong>{{ pitGetSelectedEntry().title }}</strong><button type="button" class="action-button" @click="bringEntryToSampleBuilder(pitGetSelectedEntry())">带入样本构造</button><button type="button" class="action-button" @click="pitScrollToEntry(pitGetSelectedEntry())"><i class="fas fa-crosshairs"></i> 定位正文</button></div></aside><div class="console-panel pitaxonomy-catalog-panel"><div class="pitaxonomy-results-heading" aria-live="polite"><h4>{{ pitSection === 'all' ? '全部条目' : pitSectionLabel(pitSection) }}</h4><small>{{ pitSearch ? '搜索结果' : '完整正文' }} · {{ pitGetFilteredEntries().length }} 项</small></div><div v-if="!pitGetFilteredEntries().length" class="workbench-empty-panel compact-empty"><i class="fas fa-folder-open"></i><h4>没有匹配结果</h4><p>换个关键词，或切换到其他分类试试。</p><button type="button" class="action-button" @click="pitSearch = ''; pitSection = 'all'">重置筛选</button></div><div v-else="" class="pitaxonomy-group-list"><section v-for="group in pitGetCatalogGroups()" :key="group.section" :id="pitSectionAnchor(group.section)" class="pitaxonomy-group-panel" :class="{ active: pitActiveSection === group.section }"><button type="button" class="pitaxonomy-group-header" :aria-expanded="pitIsGroupCollapsed(group.section) ? 'false' : 'true'" :aria-controls="pitSectionAnchor(group.section) + '-content'" @click="pitToggleGroup(group.section)"><span class="pitaxonomy-group-title"><span class="pitaxonomy-section-card-icon"><i class="fas" :class="group.icon"></i></span><span><strong>{{ group.label }}</strong><span class="pitaxonomy-group-description">{{ group.description }}</span></span></span><span class="pitaxonomy-group-header-meta"><span class="pitaxonomy-group-count">{{ group.entries.length }}项</span><i class="fas" :class="pitIsGroupCollapsed(group.section) ? 'fa-chevron-down' : 'fa-chevron-up'"></i></span></button><div v-show="!pitIsGroupCollapsed(group.section)" :id="pitSectionAnchor(group.section) + '-content'" class="pitaxonomy-card-grid pitaxonomy-group-grid pitaxonomy-list-stack"><article v-for="entry in group.entries" :key="entry.section + '-' + entry.id" :id="pitEntryAnchor(entry)" class="pitaxonomy-knowledge-card pitaxonomy-list-item reading-mode-block" :class="{ active: pitSelectedId === entry.id &amp;&amp; pitSelectedSection === entry.section }" @click="pitSelectEntry(entry)"><div class="pitaxonomy-card-head"><h5 class="pitaxonomy-entry-title">{{ entry.title }}</h5><div class="pitaxonomy-card-stats"><small>{{ (entry.ideas || []).length }}条思路</small><small>{{ pitExampleCount(entry) }}个示例</small></div></div><p class="reading-mode-text pitaxonomy-card-description">{{ entry.description }}</p><div class="pitaxonomy-article-section" v-if="entry.ideas &amp;&amp; entry.ideas.length"><div class="pitaxonomy-article-section-head"><h5><i class="fas fa-lightbulb"></i> 关键思路</h5></div><div class="pitaxonomy-card-idea-list"><div class="pitaxonomy-card-idea-item" v-for="idea in entry.ideas" :key="idea"><i class="fas fa-minus"></i><span>{{ idea }}</span></div></div></div><div class="pitaxonomy-article-section" v-if="entry.examples &amp;&amp; entry.examples.length"><div class="pitaxonomy-article-section-head"><h5><i class="fas fa-file-lines"></i> 案例示例</h5></div><div class="pitaxonomy-example-list pitaxonomy-inline-example-list"><article v-for="(example, exampleIndex) in entry.examples" :key="entry.section + '-' + entry.id + '-example-' + exampleIndex" class="pitaxonomy-example-card reading-mode-block"><div class="pitaxonomy-example-heading"><small>示例 {{ exampleIndex + 1 }}</small><button type="button" class="action-button copy" @click.stop="pitCopyExample(example)"><i class="fas fa-copy"></i> 复制示例</button></div><pre class="reading-mode-text">{{ example }}</pre></article></div></div><div class="pitaxonomy-card-footer pitaxonomy-library-entry-footer"><small>{{ pitSectionLabel(entry.section) }}</small><div class="tool-toolbar compact-toolbar"><button type="button" class="action-button" @click.stop="pitSelectEntry(entry)"><i class="fas fa-thumbtack"></i> {{ pitSelectedId === entry.id &amp;&amp; pitSelectedSection === entry.section ? '当前条目' : '设为当前' }}</button><button type="button" class="action-button copy" @click.stop="pitCopyEntry(entry)"><i class="fas fa-copy"></i> 复制条目</button></div></div></article></div></section></div></div></div><button v-show="pitShowBackToTop" type="button" class="pitaxonomy-back-to-top" @click="pitScrollToTop()"><i class="fas fa-arrow-up"></i><span>返回顶部</span></button></template></div></div></div></div>
