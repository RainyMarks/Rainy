<!-- injectiongenerator tool view. -->
<div class="tab-content tab-content-injectiongenerator"><div class="transform-layout"><div class="transform-section"><div class="section-header-card workbench-intro-card"><div class="section-header-card-title"><i class="fas fa-dice"></i><h3>提示词注入生成器</h3></div></div><div class="ig-workspace"><div class="ig-controls"><h4>配置样本</h4><div class="tool-toolbar" role="group" aria-label="模板语言"><button type="button" class="btn" :class="igLanguage === 'zh' ? 'tool-primary-btn' : 'btn-secondary'" :aria-pressed="igLanguage === 'zh'" @click="igSetLanguage('zh')">中文</button><button type="button" class="btn" :class="igLanguage === 'en' ? 'tool-primary-btn' : 'btn-secondary'" :aria-pressed="igLanguage === 'en'" @click="igSetLanguage('en')">English</button></div><div class="options-grid"><label>模板类型<select v-model="igCategory"><option value="all">全部类型</option><option v-for="category in igCategories" :key="category.id" :value="category.id">{{ category.name }}</option></select></label><label>生成数量<input type="number" v-model.number="igCount" min="1" max="20" step="1"></label></div><div class="input-section"><label for="ig-custom">附加指令（可选，原样追加到每条结果末尾）</label><textarea id="ig-custom" v-model="igCustom" rows="3" placeholder="留空则仅使用内置模板"></textarea></div><details class="ig-advanced"><summary>复现设置</summary><label for="ig-seed">随机种子</label><input id="ig-seed" v-model="igSeed" placeholder="留空自动生成，固定值可复现"></details><div class="tool-toolbar"><button type="button" class="transform-button tool-primary-btn" @click="igGenerate"><i class="fas fa-dice"></i> 生成提示词</button><button type="button" class="btn btn-secondary" :disabled="!igResults.length" @click="igResults = []">清空结果</button></div></div><div class="ig-samples"><div class="ig-result-heading"><h4>样本工作区</h4></div><div class="tool-toolbar" v-if="igResults.length"><button type="button" class="btn btn-secondary" @click="copyToClipboard(igSerialize('txt'))">复制全部</button><button v-for="format in ['txt', 'json', 'jsonl']" :key="format" type="button" class="btn btn-secondary" @click="igExport(format)">导出 {{ format.toUpperCase() }}</button></div><p v-if="igResults.length" class="ig-batch-note">本批种子：{{ igLastSeed }}</p><div aria-live="polite"><p v-if="!igResults.length">暂无结果</p><p v-else="">已生成 {{ igResults.length }} 条</p></div><div v-for="(result, index) in igResults" :key="index" class="output-section"><div class="section-header"><h4>样本 {{ index + 1 }} · {{ result.categories }}</h4><span>{{ result.text.length }} 字符{{ result.duplicate ? ' · 生成时重复' : '' }}{{ result.text !== result.generated ? ' · 已编辑' : '' }}</span></div><details><summary>查看原始模板</summary><pre style="white-space: pre-wrap; overflow-wrap: anywhere;">{{ result.original }}</pre></details><label :for="'ig-result-' + index">可编辑结果</label><textarea :id="'ig-result-' + index" v-model="result.text" rows="6"></textarea><div class="tool-toolbar"><button type="button" class="transform-button tool-primary-btn" :disabled="!result.text.trim()" @click="igSendToTransform(result.text)"><i class="fas fa-arrow-right"></i> 送入文本变换</button><button type="button" class="btn btn-secondary" :disabled="!result.text.trim()" @click="copyToClipboard(result.text)">复制</button><button type="button" class="btn btn-secondary" @click="result.text = result.generated">恢复生成结果</button></div></div></div></div></div></div></div>
